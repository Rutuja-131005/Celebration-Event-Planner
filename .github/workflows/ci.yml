name: CI Pipeline - Celebration Atelier

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Verify Quality, Security, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Typecheck & Lint
        run: npm run lint

      - name: 2. Security Audit
        run: npm audit --audit-level=high

      - name: 3. Backend & Unit Tests with Coverage
        run: npm test

      - name: 4. Production Build Verification
        run: npm run build

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
